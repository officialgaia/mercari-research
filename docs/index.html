<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="相場リサーチ">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>相場リサーチ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <img src="icons/icon.svg" alt="" class="logo">
  <div class="title">
    <h1>相場リサーチ</h1>
    <span id="genAt" class="sub"></span>
  </div>
  <button id="openSettings" class="icon-btn" aria-label="設定" hidden>⚙</button>
</header>

<div id="progress" class="progress" hidden>
  <span id="progressText"></span>
  <div class="bar"><div></div></div>
</div>

<main>
  <!-- ログイン -->
  <section id="view-setup" class="view" hidden>
    <h2>はじめに</h2>
    <p class="lead">GitHubのSecretに登録したパスワードを入れてください。</p>
    <form id="setupForm" class="form">
      <label>パスワード
        <input name="password" type="password" required autocomplete="current-password">
      </label>
      <label>GitHubトークン<small>（キーワード追加・今すぐ調べるに使います。見るだけなら空欄）</small>
        <input name="token" type="password" autocomplete="off" placeholder="github_pat_…">
      </label>
      <label>リポジトリ
        <input name="repo" placeholder="officialgaia/mercari-research">
      </label>
      <p id="setupErr" class="err" hidden></p>
      <button type="submit" class="btn primary" id="setupBtn">はじめる</button>
    </form>
  </section>

  <!-- 一覧 -->
  <section id="view-list" class="view" hidden>
    <div class="chips" role="tablist">
      <button class="chip on" data-filter="go">おすすめ <span id="cntGo"></span></button>
      <button class="chip" data-filter="maybe">候補 <span id="cntMaybe"></span></button>
      <button class="chip" data-filter="all">すべて <span id="cntAll"></span></button>
    </div>
    <ol id="list" class="list"></ol>
    <div id="empty" class="empty" hidden></div>
    <p class="foot" id="foot"></p>
  </section>
</main>

<!-- 詳細 -->
<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-head">
    <button class="icon-btn" data-close aria-label="閉じる">‹</button>
    <h2 id="sheetTitle"></h2>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div id="toast" class="toast" hidden></div>
<script src="crypto.js"></script>
<script src="judge.js"></script>
<script src="app.js"></script>
</body>
</html>
