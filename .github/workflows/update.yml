name: メルカリ相場を取得

on:
  schedule:
    - cron: "17 21 * * *"   # 毎日 6:17（日本時間）
  workflow_dispatch:
    inputs:
      ids:
        description: "取り直す候補のID（カンマ区切り。all で全部）"
        required: false
        default: "all"
  push:
    branches: [main]
    paths: ["docs/data/config.enc.json"]   # サイトで候補を追加・編集したとき

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 取得
        env:
          DATA_PASSWORD: ${{ secrets.DATA_PASSWORD }}
          IDS: ${{ github.event.inputs.ids }}
        run: python -m research.update

      - name: 結果を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "相場データを更新"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
